package: apigen
output: internal/httpapi/apigen/api.gen.go
generate:
  chi-server: true
  models: true
output-options:
  skip-prune: false
  # streamThreadEvents is a text/event-stream endpoint; it's hand-routed in
  # httpapi so the stream can opt out of the 30s request timeout. Kept in the
  # spec for docs + the typed TS client, but no chi-server stub is generated.
  exclude-operation-ids:
    - streamThreadEvents
