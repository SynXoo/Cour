  /me/pulse:
    get:
      operationId: getMyPulse
      summary: The viewer's pulse — streak, badges, replies to them, kudos
      description: >
        The signed-in home's incentive block (§M3.8). Streak = consecutive
        days with any activity, computed on the viewer's calendar (pass tz).
        Badges are thresholds on lifetime counters; next_badge is the closest
        unearned one. Replies are other members' replies to the viewer's
        comments; kudos is the reactions their comments drew this week.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tz
          in: query
          description: IANA time zone for day boundaries (unknown zones fall back to UTC)
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The viewer's pulse
          content:
