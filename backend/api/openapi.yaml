  /threads/{threadId}/comments:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listComments
      summary: A thread's comments, newest first, keyset-paginated (client builds the tree)
      description: >
        One page of a thread's comments, ordered id-descending (newest first) to
        match the client's default. Keyset pagination: omit `before_id` for the
        newest page, then pass the response's `next_cursor` back as `before_id`
        to load the next-older page. `next_cursor` is null once the oldest
        comment has been reached. The client reverses the merged pages back to
        arrival order to build the reply tree (a parent's id always precedes its
        replies'); replies whose parent lands on a not-yet-loaded older page are
        shown at top level until that page is pulled in.
      parameters:
        - name: before_id
          in: query
          description: Return comments with id strictly less than this (older). Omit for the newest page.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Comments with authors and reactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postComment
      summary: Add a comment (optionally anchored to a moment)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCommentRequest" }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "#/components/responses/Error"

  /threads/{threadId}/events:
    get:
      operationId: streamThreadEvents
      summary: Live thread events (Server-Sent Events)
      description: >
        An `text/event-stream` that pushes a thread's activity as it happens.
        The connection itself is the presence signal — no token is required
        (public threads are public to read). Named SSE events, each with a
        JSON `data` payload:


        - `comment.created` — a `Comment` (same shape as the REST response).

        - `comment.deleted` — a `CommentDeleted` (the tombstoned comment id).

        - `reaction.updated` — a `ReactionUpdate` (comment id, emoji, new
          absolute count).

        - `presence` — a `PresenceUpdate` (current live reader count); sent on
          connect and whenever the count changes.

        - `ping` — an empty keep-alive comment line, ignored by clients.


        This endpoint is hand-routed (excluded from the generated server) so
        the stream can opt out of the request timeout; the schema is here for
        documentation and the typed client. Posting stays plain REST.
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: An event stream (stays open until the client disconnects)
          content:
            text/event-stream:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"

  # ── Watch parties (docs/WATCH_PARTIES.md, M4) ─────────────────────────
  # Every route here is dark unless FEATURE_WATCH_PARTIES is on — off, they
  # 404 like any unknown path, and /features reports the flag so the client
  # can hide its entry points.

  /features:
    get:
      operationId: getFeatures
      summary: Which optional features this deployment has switched on
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Features" }
        default:
          $ref: "#/components/responses/Error"

  /parties:
    post:
      operationId: createParty
      summary: Start a watch party on an episode
      description: >
        Opens a room bound to one episode; the caller becomes its host. A host
        runs one room at a time — starting a new party closes the caller's
        previous open one. Cour never hosts, proxies, or links to video: a
        party synchronizes people (presence, a shared clock, chat), and every
        participant brings their own legal source.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201":
          description: Party created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchParty" }
        default:
          $ref: "#/components/responses/Error"

  /parties/{partyId}:
    get:
      operationId: getParty
      summary: A watch party's shell (episode, host, visibility, open/closed)
      description: >
        Visibility gates who may see and join: `public` — any signed-in user;
        `followers` — the host's followers and friends; `invite` — the host's
        friends (explicit invites arrive with room lifecycle, M4.4). The live
        member list is not here — it arrives over the socket (`/ws`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The party
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchParty" }
        default:
          $ref: "#/components/responses/Error"

  /ws:
    get:
      operationId: partySocket
      summary: The watch-party WebSocket gateway
      description: >
        One WebSocket per client; frames are JSON objects `{op, data}` in both
        directions. Hand-routed (excluded from the generated server) like the
        SSE stream, outside the request timeout. Authenticate either with a
        bearer header on the upgrade request or, from a browser, with a first
        frame `{op:"auth", data:{token}}` within 5 s.


        Client → server ops:

        - `auth` — `{token}`; required first frame when no bearer header.

        - `join` — `{party}` (the party id). One party per socket; joining
          another leaves the first. Replies `state`, or `error`.

        - `leave` — `{}`.

        - `heartbeat` — `{}`; send every 15 s. A socket silent for 60 s is
          closed; a member unseen for 45 s is swept from presence.

        - `play` — `{position?}`, `pause` — `{position?}`, `seek` —
          `{position}` (seconds): the shared clock, **host only** (anyone
          else gets `error forbidden`). Cour never touches a player — the
          clock is a shared stopwatch everyone lines their own stream up
          with. `play` without a position resumes from the paused anchor;
          `pause` without one freezes at the current interpolated position.

        - `chat` — `{body, persist?}` (1–500 chars). `react` —
          `{emoji, position?, persist?}` (an `Emoji`; `position` defaults to
          the clock's current position). Both broadcast a `PartyMessage`
          to the room. With `persist: true` the message also lands in the
          episode's thread as a timestamped comment (the author's own
          opt-in — that is how a party enriches the async thread instead
          of competing with it); the broadcast then carries `comment_id`.
          Rate-limited per user (`error rate_limited`); the language
          policy applies (`error validation_failed`).


        Server → client ops:

        - `hello` — `{user_id, username}` once authenticated.

        - `state` — a `PartyState` (the party, everyone present, the clock,
          the recent chat) on join.

        - `member.joined` — a `PartyMember`; `member.left` — a
          `PartyMemberLeft`. Broadcast to the room across instances.

        - `clock` — a `PartyClock` whenever the host changes it (broadcast);
          `sync` — the same shape, sent to each socket every 30 s so
          client-side interpolation (`position + (now − received_at)` while
          playing) never drifts far.

        - `chat` / `react` — a `PartyMessage` (kind matches the op),
          broadcast to the room. The `state` snapshot carries the last 50
          as `chat`, oldest first.

        - `error` — `{code, message}` with the REST error codes
          (`unauthorized`, `not_found`, `forbidden`, `bad_request`).
      responses:
        "101":
          description: Switching protocols
        default:
          $ref: "#/components/responses/Error"


  /threads/trending:
    get:
      operationId: getTrendingThreads
      summary: Busiest threads right now — recent comments, time-decayed, plus live presence
      description: >
        Threads ranked by comment velocity: each comment in the recent window
        contributes with exponential time decay (the Trending Now shape, much
        shorter half-life), and every reader connected to the thread's live
        stream adds a presence bonus. Recomputed at most once a minute.
        Powers the home page's "live now" rail and the threads hub.
      parameters:
