      responses:
        "200":
          description: Ranked, explained titles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainedTrendingList" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        username:
          type: string
          pattern: "^[a-zA-Z0-9_]{3,20}$"
          description: 3-20 characters, letters/digits/underscore
        password: { type: string, minLength: 8, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: Short-lived JWT for the Authorization header }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access-token lifetime in seconds }
        user: { $ref: "#/components/schemas/UserPrivate" }

    Role:
      type: string
      enum: [user, mod, admin]

    UserPrivate:
      type: object
      required: [id, email, username, avatar_url, bio, favorite_genres, role, email_verified, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string }
        favorite_genres:
          type: array
          items: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    UserProfile:
      type: object
      required:
        [username, avatar_url, bio, favorite_genres, role, created_at, banner,
         accent_color, stats, favorites, currently_watching]
      properties:
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string }
        favorite_genres:
          type: array
          items: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        banner:
          nullable: true
          description: The owner's chosen banner anime, resolved; null when unset
          allOf: [{ $ref: "#/components/schemas/ProfileBanner" }]
        accent_color:
          type: string
          nullable: true
          description: Owner-picked page accent (hex); null = derive from banner/favorites
        stats: { $ref: "#/components/schemas/ProfileStats" }
        favorites:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        currently_watching:
          type: array
          items: { $ref: "#/components/schemas/WatchingEntry" }

    ProfileBanner:
      type: object
      required: [anime_id, banner_image, cover_color]
      properties:
        anime_id: { type: integer, format: int64 }
        banner_image: { type: string, nullable: true }
        cover_color: { type: string, nullable: true, description: Dominant cover color, hex }

    ProfileStats:
      type: object
      required:
        [counts, mean_score, rated_count, episodes_watched, watch_minutes,
         score_histogram, score_stddev, score_bias, genres, season_counts,
         format_counts, top_studios, longest_completed, library_span]
      properties:
        counts:
          type: object
          required: [watching, completed, planning, paused, dropped]
          properties:
            watching: { type: integer }
            completed: { type: integer }
            planning: { type: integer }
            paused: { type: integer }
            dropped: { type: integer }
        mean_score:
          type: number
          nullable: true
          description: Mean of 1-10 scores; null until something is rated
        rated_count: { type: integer }
        episodes_watched: { type: integer }
        watch_minutes:
          type: integer
          format: int64
          description: Σ progress × episode duration; 0 when nothing watched
        score_histogram:
          type: array
          description: All ten 1-10 buckets, ascending; zero counts included
          items:
            type: object
            required: [score, count]
            properties:
              score: { type: integer }
              count: { type: integer }
        score_stddev:
          type: number
          nullable: true
          description: >-
            Population standard deviation of the 1-10 scores — how much of the
            scale the owner actually uses. Null with fewer than two ratings.
        score_bias:
          nullable: true
          description: >-
            The owner's mean against the community's mean over the same shows.
            Null until enough of their rated shows carry a community score for
            the comparison to mean anything.
          allOf: [{ $ref: "#/components/schemas/ScoreBias" }]
        genres:
          type: array
          items: { $ref: "#/components/schemas/GenreStat" }
        season_counts:
          type: array
          description: Completed shows bucketed by premiere year, ascending — the owner's eras
          items: { $ref: "#/components/schemas/SeasonCount" }
        format_counts:
          type: array
          description: Library split by format, largest first
          items: { $ref: "#/components/schemas/FormatCount" }
        top_studios:
          type: array
          description: Main studios behind the library, most-watched first (max 3)
          items: { $ref: "#/components/schemas/StudioCount" }
        longest_completed:
          nullable: true
          description: The longest series the owner has finished; null when nothing is completed
          allOf: [{ $ref: "#/components/schemas/AnimeSummary" }]
        library_span:
          nullable: true
          description: Premiere years of the oldest and newest show on the shelves
          allOf: [{ $ref: "#/components/schemas/LibrarySpan" }]

    ScoreBias:
      type: object
      required: [user_mean, community_mean, sample_size]
      properties:
        user_mean: { type: number, description: Owner's mean over the compared shows }
        community_mean:
          type: number
          description: AniList's mean over the same shows, rescaled to 1-10
        sample_size:
          type: integer
          description: Shows the owner rated that also carry a community score

    GenreStat:
      type: object
      required: [genre, count, mean_score, rated_count]
      properties:
        genre: { type: string }
        count: { type: integer }
        mean_score:
          type: number
          nullable: true
          description: Mean 1-10 score across the owner's rated entries in this genre
        rated_count:
          type: integer
          description: How many of those entries carry a score — the mean's weight

    SeasonCount:
      type: object
      required: [year, count]
      properties:
        year: { type: integer }
        count: { type: integer }

    FormatCount:
      type: object
      required: [format, count]
      properties:
        format: { $ref: "#/components/schemas/Format" }
        count: { type: integer }

    StudioCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    LibrarySpan:
      type: object
      required: [earliest_year, latest_year]
      properties:
        earliest_year: { type: integer }
        latest_year: { type: integer }

    WatchingEntry:
      type: object
      required: [anime, progress]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        progress: { type: integer }

    UpdateProfileRequest:
      type: object
      properties:
        bio: { type: string, maxLength: 500 }
        avatar_url:
          type: string
          nullable: true
          maxLength: 500
          description: http(s) URL; null clears the avatar
        favorite_genres:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 30 }
        banner_anime_id:
          type: integer
          format: int64
          minimum: 0
          description: Anime whose banner art heads the profile; 0 clears it, omitted keeps it
        accent_color:
          type: string
          maxLength: 7
          description: "Page accent as #rrggbb; empty string clears it, omitted keeps it"

    ListStatus:
      type: string
      enum: [watching, completed, planning, paused, dropped]

    ListEntry:
      type: object
      required: [anime_id, status, score, progress, started_on, finished_on, updated_at]
      properties:
        anime_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ListStatus" }
        score: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        progress: { type: integer, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }
        updated_at: { type: string, format: date-time }

    ListEntryWithAnime:
      allOf:
        - $ref: "#/components/schemas/ListEntry"
        - type: object
          required: [anime]
          properties:
            anime: { $ref: "#/components/schemas/AnimeSummary" }

    MyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ListEntryWithAnime" }

    UserList:
      type: object
      required: [data, total, page, per_page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ListEntryWithAnime" }
        total: { type: integer, description: Entries matching the filters across all pages }
        page: { type: integer }
        per_page: { type: integer }

    UpsertListEntryRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ListStatus" }
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
          description: 1-10; 0 clears the score; omitted keeps it
        progress: { type: integer, nullable: true, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }

    FavoritesList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    FavoriteState:
      type: object
      required: [favorited]
      properties:
        favorited: { type: boolean }

    ReviewAuthor:
      type: object
      required: [username, avatar_url]
      properties:
        username: { type: string }
        avatar_url: { type: string, nullable: true }

    Review:
      type: object
      required:
        [id, anime_id, author, body, score, has_spoilers, helpful_count,
         voted, is_mine, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        anime_id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/ReviewAuthor" }
        body: { type: string }
        score: { type: integer, minimum: 1, maximum: 10 }
        has_spoilers: { type: boolean }
        helpful_count: { type: integer }
        voted: { type: boolean, description: Whether the caller marked it helpful (false when anonymous) }
        is_mine: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReviewDetail:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [anime]
          properties:
            anime: { $ref: "#/components/schemas/AnimeSummary" }

    UpsertReviewRequest:
      type: object
      required: [body, score]
      properties:
        body: { type: string, minLength: 100, maxLength: 20000 }
        score: { type: integer, minimum: 1, maximum: 10 }
        has_spoilers: { type: boolean, default: false }

    ReviewList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        page: { $ref: "#/components/schemas/PageInfo" }

    UserReviewList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReviewDetail" }
        page: { $ref: "#/components/schemas/PageInfo" }

    HelpfulState:
      type: object
      required: [helpful_count, voted]
      properties:
        helpful_count: { type: integer }
        voted: { type: boolean }

    ReportSubject:
      type: string
      enum: [review, comment, user]

    FileReportRequest:
      type: object
      required: [subject_type, subject_id, reason]
      properties:
        subject_type: { $ref: "#/components/schemas/ReportSubject" }
        subject_id: { type: integer, format: int64 }
        reason: { type: string, minLength: 3, maxLength: 500 }

    Report:
      type: object
      required: [id, subject_type, subject_id, reason, reporter, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_type: { $ref: "#/components/schemas/ReportSubject" }
        subject_id: { type: integer, format: int64 }
        reason: { type: string }
        reporter: { type: string, description: Reporter's username }
        created_at: { type: string, format: date-time }

    ReportList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        next_cursor:
          type: integer
          format: int64
          nullable: true

    ResolveReportRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [resolved, dismissed]

    ImportSource:
      type: string
      enum: [anilist, mal]

    ImportStatus:
      type: string
      description: >
        pending/processing — being fetched and matched; ready — preview
        available, awaiting commit; committing — apply in flight; done —
        applied; failed — fetch or parse error (see `error`); superseded —
        replaced by a newer import before commit.
      enum: [pending, processing, ready, committing, done, failed, superseded]

    ImportMatch:
      type: string
      description: >
        How the row found its target: by source id, by title similarity,
        or not at all (`review` — resolve manually or it is skipped).
      enum: [id, title, review]

    StartAniListImportRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 30
          description: AniList username; the list must be public

    ImportCounts:
      type: object
      description: Zero until the relevant stage has run.
      required: [total, matched, review, conflicts, applied, skipped]
      properties:
        total: { type: integer, description: Parsed source rows }
        matched: { type: integer, description: Rows with a target anime }
        review: { type: integer, description: Rows needing manual resolution }
        conflicts: { type: integer, description: Matched rows already on the list at preview time }
        applied: { type: integer, description: Rows written by the commit }
        skipped: { type: integer, description: Rows the commit left out (merge conflicts, unresolved reviews, exclusions) }

    ImportJob:
      type: object
      required: [id, source, status, counts, error, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        source: { $ref: "#/components/schemas/ImportSource" }
        status: { $ref: "#/components/schemas/ImportStatus" }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        error:
          type: string
          nullable: true
          description: Human-readable failure reason, when failed
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImportRow:
      type: object
      required: [row_index, title, status, score, progress, match, anime, on_list]
      properties:
        row_index:
          type: integer
          description: Stable index into the job's parsed rows; key for `resolutions`
        title: { type: string, description: Title as it appears in the source }
        status: { $ref: "#/components/schemas/ListStatus" }
        score: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        progress: { type: integer, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }
        match: { $ref: "#/components/schemas/ImportMatch" }
        anime:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AnimeSummary" }]
          description: The matched target; null for review rows
        on_list:
          type: boolean
          description: Already on the user's list when the preview was built

    ImportJobDetail:
      allOf:
        - $ref: "#/components/schemas/ImportJob"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              description: Empty until the job is ready
              items: { $ref: "#/components/schemas/ImportRow" }

    ImportResolution:
      type: object
      required: [row_index, anime_id]
      properties:
        row_index: { type: integer, minimum: 0 }
        anime_id:
          type: integer
          format: int64
          nullable: true
          description: Target anime for this row; null excludes the row

    CommitImportRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [merge, overwrite]
          description: merge skips titles already on the list; overwrite lets the import win
        resolutions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ImportResolution" }

    TrendingList:
      type: object
      required: [data, computed_at]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        computed_at: { type: string, format: date-time, nullable: true }

    DiscoveryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    TrendingSignals:
      type: object
      description: Activity counts inside the trending window that earned the rank
      required: [comments, list_adds, completed, favorites, reviews, scored]
      properties:
        comments: { type: integer }
        list_adds: { type: integer }
        completed: { type: integer }
        favorites: { type: integer }
        reviews: { type: integer }
        scored: { type: integer }

    TrendingYou:
      type: object
      description: Why this title matters to the signed-in viewer
      required: [status, followees, followees_count, shared_genres]
      properties:
        status:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ListStatus" }]
          description: The viewer's list status for the title, if it's on their list
        followees:
          type: array
          items: { type: string }
          description: Up to three usernames the viewer follows who are watching/completed it
        followees_count: { type: integer }
        shared_genres:
          type: array
          items: { type: string }
          description: Genres this title shares with the viewer's most-watched genres (max 2)

    ExplainedTrending:
      type: object
      required: [anime, rank, signals, you]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        rank: { type: integer }
        signals: { $ref: "#/components/schemas/TrendingSignals" }
        you:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TrendingYou" }]
          description: Null for anonymous callers

    ExplainedTrendingList:
      type: object
      required: [data, computed_at]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ExplainedTrending" }
        computed_at: { type: string, format: date-time, nullable: true }

    RoomKind:
      type: string
      enum: [series, episode]

    BadgeTier:
      type: string
      enum: [bronze, silver, gold]

    Badge:
      type: object
      required: [id, label, description, tier]
      properties:
        id: { type: string, description: Stable key; never renamed }
        label: { type: string }
        description: { type: string }
        tier: { $ref: "#/components/schemas/BadgeTier" }

    BadgeProgress:
      type: object
      description: The closest unearned badge and how far along the viewer is
      required: [id, label, description, tier, progress, target]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        tier: { $ref: "#/components/schemas/BadgeTier" }
        progress: { type: integer }
        target: { type: integer }

    Streak:
      type: object
      required: [current, best, active_today, week]
      properties:
        current: { type: integer, description: Consecutive active days ending today or yesterday }
        best: { type: integer }
        active_today: { type: boolean }
        week:
          type: array
          items: { type: boolean }
          minItems: 7
          maxItems: 7
          description: The last seven days, oldest first; the last entry is today

    ReplyToMe:
      type: object
      required: [comment_id, actor, anime, episode, kind, snippet, parent_snippet, created_at]
      properties:
        comment_id: { type: integer, format: int64 }
        actor: { $ref: "#/components/schemas/ReviewAuthor" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { type: integer, nullable: true, description: Episode number for episode rooms }
        kind: { $ref: "#/components/schemas/RoomKind" }
        snippet: { type: string, description: The reply, truncated }
        parent_snippet: { type: string, description: The viewer's own comment it answers, truncated }
        created_at: { type: string, format: date-time }

    KudosComment:
      type: object
      required: [comment_id, anime, episode, kind, snippet, reactions]
      properties:
        comment_id: { type: integer, format: int64 }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { type: integer, nullable: true }
        kind: { $ref: "#/components/schemas/RoomKind" }
        snippet: { type: string }
        reactions: { type: integer }

    Kudos:
      type: object
      required: [reactions_week, top]
      properties:
        reactions_week: { type: integer, description: Reactions the viewer's comments drew in the last 7 days }
        top:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/KudosComment" }]

    Pulse:
      type: object
      required: [streak, badges, next_badge, replies, kudos]
      properties:
        streak: { $ref: "#/components/schemas/Streak" }
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }
        next_badge:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BadgeProgress" }]
        replies:
          type: array
          items: { $ref: "#/components/schemas/ReplyToMe" }
        kudos: { $ref: "#/components/schemas/Kudos" }

    RecommendationItem:
      type: object
      required: [anime, reasons]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        reasons:
          type: array
          items: { type: string }

    Recommendations:
      type: object
      required: [data, cold_start]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItem" }
        cold_start:
          type: boolean
          description: True when there was no taste signal and the list falls back to trending + gems

    RelationState:
      type: object
      required: [followers, following, is_following, friends, friendship]
      properties:
        followers: { type: integer }
        following: { type: integer }
        is_following: { type: boolean, description: Always false for anonymous callers }
        friends: { type: integer }
        friendship:
          $ref: "#/components/schemas/FriendshipStatus"

    FriendshipStatus:
      type: string
      description: The caller's standing with this user; `none` for anonymous callers
      enum: [none, friends, request_sent, request_received, self]

    FriendRequestBody:
      type: object
      properties:
        note: { type: string, maxLength: 200, description: Optional line that rides the request }

    FriendRef:
      type: object
      required: [username, avatar_url, since]
      properties:
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        since: { type: string, format: date-time }

    FriendRequest:
      type: object
      required: [user, note, created_at]
      properties:
        user: { $ref: "#/components/schemas/ReviewAuthor" }
        note: { type: string }
        created_at: { type: string, format: date-time }

    FriendsOverview:
      type: object
      required: [friends, incoming, outgoing, suggested]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/FriendRef" }
        incoming:
          type: array
          description: Requests waiting on the caller
          items: { $ref: "#/components/schemas/FriendRequest" }
        outgoing:
          type: array
          description: Requests the caller sent
          items: { $ref: "#/components/schemas/FriendRequest" }
        suggested:
          type: array
          description: Mutual follows who aren't friends yet
          items: { $ref: "#/components/schemas/ReviewAuthor" }

    FriendOnAnime:
      type: object
      required: [user, status, progress, score]
      properties:
        user: { $ref: "#/components/schemas/ReviewAuthor" }
        status: { $ref: "#/components/schemas/ListStatus" }
        progress: { type: integer, minimum: 0 }
        score: { type: integer, nullable: true, minimum: 1, maximum: 10 }

    AnimeRecommendation:
      type: object
      required: [from, note, created_at]
      properties:
        from: { $ref: "#/components/schemas/ReviewAuthor" }
        note: { type: string }
        created_at: { type: string, format: date-time }

    FriendsOnAnime:
      type: object
      required: [data, recommendations]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FriendOnAnime" }
        recommendations:
          type: array
          description: Friends who recommended this show to the caller
          items: { $ref: "#/components/schemas/AnimeRecommendation" }

    RecommendRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, description: Friend's username }
        note: { type: string, maxLength: 500 }

    FriendRecommendation:
      type: object
      required: [anime, from, note, created_at]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        from: { $ref: "#/components/schemas/ReviewAuthor" }
        note: { type: string }
        created_at: { type: string, format: date-time }

    FriendRecommendationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FriendRecommendation" }

    InboxEntry:
      type: object
      required: [peer, last_body, last_mine, last_at, unread]
      properties:
        peer: { $ref: "#/components/schemas/ReviewAuthor" }
        last_body: { type: string }
        last_mine: { type: boolean, description: The caller sent the last message }
        last_at: { type: string, format: date-time }
        unread: { type: integer }

    Inbox:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/InboxEntry" }

    DirectMessage:
      type: object
      required: [id, sender, mine, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        sender: { type: string, description: Username }
        mine: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }

    MessagePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DirectMessage" }
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: Pass back as ?before_id= for the next (older) page; null at the oldest message

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    UserRefList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReviewAuthor" }

    ActivityType:
      type: string
      enum: [list_add, status_change, progress, completed, scored, favorite, review, comment, helpful_vote]

    FeedItem:
      type: object
      required: [id, actor, type, anime, ref_id, payload, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: "#/components/schemas/ReviewAuthor" }
        type: { $ref: "#/components/schemas/ActivityType" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        ref_id: { type: integer, format: int64, nullable: true }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    Feed:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: Pass back as ?cursor= for the next page; null at the end

    NotificationType:
      type: string
      enum: [comment_reply, new_follower, episode_aired, friend_request, friend_accepted, mention, recommendation]

    Notification:
      type: object
      required: [id, type, actor, anime, ref_id, payload, read, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/NotificationType" }
        actor:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReviewAuthor" }]
        anime:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AnimeSummary" }]
        ref_id: { type: integer, format: int64, nullable: true }
        payload:
          type: object
          additionalProperties: true
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_cursor:
          type: integer
          format: int64
          nullable: true

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    MarkReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: integer, format: int64 }
        all: { type: boolean, default: false }

    Emoji:
      type: string
      enum: ["+1", heart, laugh, surprise, cry, fire]

    Thread:
      type: object
      required: [id, anime_id, kind, comment_count, last_activity_at]
      properties:
        id: { type: integer, format: int64 }
        anime_id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [series, episode]
        comment_count: { type: integer }
        last_activity_at: { type: string, format: date-time }

    EpisodeThread:
      type: object
      required: [thread, anime, episode]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { $ref: "#/components/schemas/Episode" }

    ThreadIndex:
      type: object
      required: [series, episodes]
      properties:
        series:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Thread" }]
        episodes:
          type: array
          items:
            type: object
            required: [number, thread_id, comment_count, last_activity_at]
            properties:
              number: { type: integer }
              thread_id: { type: integer, format: int64 }
              comment_count: { type: integer }
              last_activity_at: { type: string, format: date-time }

    ReactionCount:
      type: object
      required: [emoji, count, mine]
      properties:
        emoji: { $ref: "#/components/schemas/Emoji" }
        count: { type: integer }
        mine: { type: boolean }

    Comment:
      type: object
      required:
        [id, thread_id, parent_id, author, body, timestamp_seconds,
         has_spoilers, deleted, reactions, created_at]
      properties:
        id: { type: integer, format: int64 }
        thread_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, nullable: true }
        author: { $ref: "#/components/schemas/ReviewAuthor" }
        body: { type: string, description: "\"[removed]\" when deleted" }
        timestamp_seconds:
          type: integer
          nullable: true
          description: Moment anchor within the episode
        has_spoilers: { type: boolean }
        deleted: { type: boolean }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionCount" }
        created_at: { type: string, format: date-time }

    CommentList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: Pass back as ?before_id= for the next (older) page; null at the oldest comment

    # ── Live thread events (SSE payloads for streamThreadEvents) ──────────
    CommentDeleted:
      type: object
      required: [comment_id]
      properties:
        comment_id: { type: integer, format: int64 }

    ReactionUpdate:
      type: object
      required: [comment_id, emoji, count]
      properties:
        comment_id: { type: integer, format: int64 }
        emoji: { $ref: "#/components/schemas/Emoji" }
        count: { type: integer, description: New absolute count for this emoji }

    PresenceUpdate:
      type: object
      required: [count]
      properties:
        count: { type: integer, description: Live readers currently connected }

    # ── Watch parties (M4) ─────────────────────────────────────────────────
    Features:
      type: object
      required: [watch_parties]
      properties:
        watch_parties: { type: boolean, description: FEATURE_WATCH_PARTIES — rooms, /parties and the /ws gateway }

    PartyVisibility:
      type: string
      enum: [public, followers, invite]

    CreatePartyRequest:
      type: object
      required: [anime_id, episode]
      properties:
        anime_id: { type: integer, format: int64 }
        episode: { type: integer, description: Episode number within the anime }
        visibility:
          description: Defaults to `followers`
          allOf: [{ $ref: "#/components/schemas/PartyVisibility" }]

    WatchParty:
      type: object
      required: [id, anime, episode, host, visibility, created_at, closed_at]
      properties:
        id: { type: integer, format: int64 }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { $ref: "#/components/schemas/Episode" }
        host: { $ref: "#/components/schemas/ReviewAuthor" }
        visibility: { $ref: "#/components/schemas/PartyVisibility" }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    PartyMember:
      type: object
      required: [id, username, avatar_url]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        avatar_url: { type: string, nullable: true }

    PartyMemberLeft:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: The user who left }

    PartyState:
      type: object
      required: [party, members, clock, chat]
      properties:
        party: { $ref: "#/components/schemas/WatchParty" }
        members:
          type: array
          items: { $ref: "#/components/schemas/PartyMember" }
        clock: { $ref: "#/components/schemas/PartyClock" }
        chat:
          type: array
          description: The room's last 50 messages and reactions, oldest first
          items: { $ref: "#/components/schemas/PartyMessage" }

    PartyMessage:
      type: object
      required: [id, kind, from, body, emoji, position, at, comment_id]
      properties:
        id: { type: integer, format: int64, description: Monotonic per room; dedupe key }
        kind:
          type: string
          enum: [chat, react]
        from: { $ref: "#/components/schemas/PartyMember" }
        body: { type: string, nullable: true, description: The message (kind = chat) }
        emoji:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Emoji" }]
        position: { type: number, format: double, nullable: true, description: Clock position the message is anchored to, seconds }
        at: { type: string, format: date-time }
        comment_id: { type: integer, format: int64, nullable: true, description: The episode-thread comment this persisted as, when the author opted in }

    PartyClock:
      type: object
      description: >
        The shared playback clock, as an anchor: `position` was true at `at`
        (server time). While `playing`, clients render
        `position + (now − at)`; paused, `position` as is.
      required: [position, playing, at, duration]
      properties:
        position: { type: number, format: double, description: Seconds into the episode at `at` }
        playing: { type: boolean }
        at: { type: string, format: date-time, description: Server time the anchor was set or synced }
        duration: { type: integer, nullable: true, description: Episode length in seconds when the catalog knows it }

    PartyHello:
      type: object
      required: [user_id, username]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }

    PartyError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }


    TrendingThread:
      type: object
      required: [thread, anime, episode, recent_comments, presence]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Episode" }]
          description: Null for series boards
        recent_comments:
          type: integer
          description: Comments posted within the ranking window
        presence:
          type: integer
          description: Live readers connected right now

    TrendingThreadList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TrendingThread" }

    PostCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
        parent_id: { type: integer, format: int64, nullable: true }
        timestamp_seconds:
          type: integer
          nullable: true
          minimum: 0
          maximum: 35999
          description: Only valid in episode threads
        has_spoilers: { type: boolean, default: false }

    Season:
      type: string
      enum: [WINTER, SPRING, SUMMER, FALL]

    AiringStatus:
      type: string
      enum: [FINISHED, RELEASING, NOT_YET_RELEASED, CANCELLED, HIATUS]

    Format:
      type: string
      enum: [TV, TV_SHORT, MOVIE, SPECIAL, OVA, ONA, MUSIC]

    AnimeSummary:
      type: object
      required:
        [id, slug, title, title_english, cover_image, cover_color, format,
         status, season, season_year, episodes_count, average_score,
         popularity, genres, next_airing_at, next_airing_episode]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: Cosmetic URL segment derived from the title }
        title: { type: string, description: Romaji title }
        title_english: { type: string, nullable: true }
        cover_image: { type: string, nullable: true }
        cover_color: { type: string, nullable: true, description: Dominant cover color, hex }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Format" }]
        status: { $ref: "#/components/schemas/AiringStatus" }
        season:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Season" }]
        season_year: { type: integer, nullable: true }
        episodes_count: { type: integer, nullable: true }
        average_score: { type: integer, nullable: true, description: AniList community mean, 0-100 }
        popularity: { type: integer }
        genres:
          type: array
          items: { type: string }
        next_airing_at: { type: string, format: date-time, nullable: true }
        next_airing_episode: { type: integer, nullable: true }

    AnimeDetail:
      allOf:
        - $ref: "#/components/schemas/AnimeSummary"
        - type: object
          required:
            [anilist_id, title_native, synonyms, description, banner_image,
             duration_min, tags, studios, episodes, synced_at]
          properties:
            anilist_id: { type: integer }
            title_native: { type: string, nullable: true }
            synonyms:
              type: array
              items: { type: string }
            description:
              type: string
              nullable: true
              description: Plain text with newlines; AniList markup stripped.
            banner_image: { type: string, nullable: true }
            duration_min: { type: integer, nullable: true }
            tags:
              type: array
              items: { $ref: "#/components/schemas/Tag" }
            studios:
              type: array
              items: { $ref: "#/components/schemas/Studio" }
            episodes:
              type: array
              items: { $ref: "#/components/schemas/Episode" }
            synced_at: { type: string, format: date-time }

    Tag:
      type: object
      required: [name, rank]
      properties:
        name: { type: string }
        rank: { type: integer }

    Studio:
      type: object
      required: [name, is_main]
      properties:
        name: { type: string }
        is_main: { type: boolean }

    Episode:
      type: object
      required: [number, title, airing_at]
      properties:
        number: { type: integer }
        title: { type: string, nullable: true }
        airing_at: { type: string, format: date-time, nullable: true }

    ScheduleEntry:
      type: object
      required: [anime, episode, airing_at]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { type: integer }
        airing_at: { type: string, format: date-time }

    AnimeList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }

    SeasonChart:
      type: object
      required: [season, year, data]
      properties:
        season: { $ref: "#/components/schemas/Season" }
        year: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    ScheduleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEntry" }

    PageInfo:
      type: object
      required: [page, per_page, has_more]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        has_more: { type: boolean }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code: bad_request, validation_failed,
                unauthorized, forbidden, not_found, conflict, rate_limited,
                internal_error, service_unavailable.
            message: { type: string }
            details: {}
