openapi: 3.0.3
info:
  title: Cour API
  version: 0.1.0
  description: |
    REST API for Cour, the seasonal-first anime tracking platform.
    All paths are served under `/api/v1`. Errors use a consistent envelope
    with stable machine-readable codes. Anime metadata is sourced from
    AniList (https://anilist.co).
servers:
  - url: /api/v1

paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; session established (refresh cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session established (refresh cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie into a fresh session
      description: >
        Requires the httpOnly refresh cookie and an `X-Requested-With` header.
        Reusing an already-rotated token revokes the whole session family.
      responses:
        "200":
          description: New session (refresh cookie rotated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke this session family and clear the cookie
      responses:
        "204": { description: Logged out }
        default:
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      operationId: getMe
      summary: The authenticated account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPrivate" }
        default:
          $ref: "#/components/responses/Error"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with a mailed token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Email verified }
        default:
          $ref: "#/components/responses/Error"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Send a password-reset link
      description: Always answers 202 — account existence is never revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: If the account exists, an email is on its way }
        default:
          $ref: "#/components/responses/Error"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a mailed token
      description: Consuming the token revokes every live session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Password updated }
        default:
          $ref: "#/components/responses/Error"

  /auth/discord:
    get:
      operationId: discordStart
      summary: Begin Discord OAuth (redirects to discord.com)
      responses:
        "302": { description: Redirect to Discord authorize page }
        default:
          $ref: "#/components/responses/Error"

  /auth/discord/callback:
    get:
      operationId: discordCallback
      summary: Discord OAuth callback (redirects back to the web app)
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to the web app with the session cookie set }
        default:
          $ref: "#/components/responses/Error"

  /me/list:
    get:
      operationId: getMyList
      summary: The authenticated user's anime list
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ListStatus" }
      responses:
        "200":
          description: List entries, most recently updated first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyList" }
        default:
          $ref: "#/components/responses/Error"

  /me/list/{animeId}:
    parameters:
      - name: animeId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMyListEntry
      summary: This user's entry for one anime (404 when untracked)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: upsertMyListEntry
      summary: Add or update this anime on the user's list
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertListEntryRequest" }
      responses:
        "200":
          description: The resulting entry (after auto-transitions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyListEntry
      summary: Remove this anime from the user's list
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        default:
          $ref: "#/components/responses/Error"

  /me/favorites:
    get:
      operationId: getMyFavorites
      summary: The authenticated user's favorites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Favorites, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoritesList" }
        default:
          $ref: "#/components/responses/Error"

  /me/favorites/{animeId}:
    parameters:
      - name: animeId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getFavoriteState
      summary: Whether this anime is in the user's favorites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteState" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: addFavorite
      summary: Add to favorites
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Favorited }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFavorite
      summary: Remove from favorites
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Unfavorited }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}:
    get:
      operationId: getUserProfile
      summary: Public profile with stats and showcases
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/list:
    get:
      operationId: getUserPublicList
      summary: One page of a user's list, publicly browsable
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ListStatus" }
        - name: score
          in: query
          description: Only entries rated exactly this (the histogram filter)
          schema: { type: integer, minimum: 1, maximum: 10 }
        - name: genre
          in: query
          schema: { type: string, maxLength: 30 }
        - name: year
          in: query
          description: Only shows that premiered this year (the era-strip filter)
          schema: { type: integer, minimum: 1900, maximum: 2200 }
        - name: format
          in: query
          description: Only shows of this format (the format-split filter)
          schema: { $ref: "#/components/schemas/Format" }
        - name: sort
          in: query
          schema: { type: string, enum: [updated, score, title], default: updated }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: Entries with their anime, plus the filtered total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default:
          $ref: "#/components/responses/Error"

  /me/profile:
    patch:
      operationId: updateMyProfile
      summary: Edit bio, avatar, favorite genres, profile banner, and accent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPrivate" }
        default:
          $ref: "#/components/responses/Error"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a fresh email-verification link
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Sent (no-op when already verified) }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/follow:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, maxLength: 20 }
    get:
      operationId: getFollowState
      summary: Follow counts and whether the caller follows this user
      responses:
        "200":
          description: Relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: followUser
      summary: Follow this user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unfollowUser
      summary: Unfollow this user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/followers:
    get:
      operationId: listFollowers
      summary: Who follows this user
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Followers, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/following:
    get:
      operationId: listFollowing
      summary: Who this user follows
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Followed users, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /me/feed:
    get:
      operationId: getMyFeed
      summary: Activity from everyone the caller follows
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          description: "`friends` narrows the feed to friendships (default everyone followed)"
          schema: { type: string, enum: [all, friends], default: all }
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        default:
          $ref: "#/components/responses/Error"

  /users:
    get:
      operationId: searchUsers
      summary: Find people by username (prefix first, then fuzzy)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 20 }
      responses:
        "200":
          description: Up to ten matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/friend:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, maxLength: 20 }
    put:
      operationId: befriendUser
      summary: Send a friend request — or accept theirs if one is waiting
      description: >
        Mutual intent is a friendship, not a second pending row: when the
        other person already asked, this accepts. Accepting also follows
        both ways so friends land in each other's feed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FriendRequestBody" }
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unfriendUser
      summary: No relationship — cancel my request, decline theirs, or unfriend
      description: >
        Whichever the current state is. Unfriending leaves follows alone;
        they are the person's own to keep or drop.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/friends:
    get:
      operationId: listUserFriends
      summary: This user's friends, newest first
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /me/friends:
    get:
      operationId: getMyFriends
      summary: Friends, pending requests both ways, and suggestions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's friends overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendsOverview" }
        default:
          $ref: "#/components/responses/Error"

  /me/friend-recommendations:
    get:
      operationId: getFriendRecommendations
      summary: Shows friends recommended to the caller that aren't on their list yet
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRecommendationList" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/friends:
    get:
      operationId: getAnimeFriends
      summary: The caller's friends on this show, and who recommended it to them
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Watching first (furthest along at the top), then completed, then the rest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendsOnAnime" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/recommend:
    post:
      operationId: recommendAnime
      summary: Recommend this show to a friend
      description: Friends only (403 otherwise). Re-recommending updates the note.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendRequest" }
      responses:
        "204":
          description: Sent
        default:
          $ref: "#/components/responses/Error"

  /me/messages:
    get:
      operationId: getMyInbox
      summary: Conversations, newest activity first
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        default:
          $ref: "#/components/responses/Error"

  /me/messages/unread-count:
    get:
      operationId: getUnreadMessageCount
      summary: Unread direct-message count (for the header badge)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
        default:
          $ref: "#/components/responses/Error"

  /me/messages/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, maxLength: 20 }
    get:
      operationId: getConversation
      summary: One conversation, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: before_id
          in: query
          description: Keyset cursor — messages older than this id
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Message page (empty for a friend you haven't messaged yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: sendMessage
      summary: Send a direct message (friends only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessage" }
        default:
          $ref: "#/components/responses/Error"

  /me/messages/{username}/read:
    post:
      operationId: markConversationRead
      summary: Move the caller's read pointer to the end of this conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "204":
          description: Marked
        default:
          $ref: "#/components/responses/Error"

  /me/notifications:
    get:
      operationId: getMyNotifications
      summary: The caller's notifications, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: type
          in: query
          description: Only this kind of notification; omit for every kind.
          schema: { $ref: "#/components/schemas/NotificationType" }
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/unread-count:
    get:
      operationId: getUnreadCount
      summary: Unread notification count (for the bell)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read (specific ids or all)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "204": { description: Marked }
        default:
          $ref: "#/components/responses/Error"

  /reports:
    post:
      operationId: fileReport
      summary: Report content or a user to the moderators
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileReportRequest" }
      responses:
        "202": { description: Filed (duplicates are absorbed silently) }
        default:
          $ref: "#/components/responses/Error"

  /mod/reports:
    get:
      operationId: listOpenReports
      summary: Open reports queue (moderators only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Open reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        default:
          $ref: "#/components/responses/Error"

  /mod/reports/{reportId}:
    post:
      operationId: resolveReport
      summary: Close a report as resolved or dismissed (moderators only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveReportRequest" }
      responses:
        "204": { description: Closed }
        default:
          $ref: "#/components/responses/Error"

  /import/anilist:
    post:
      operationId: startAniListImport
      summary: Import a public AniList list by username
      description: >
        Creates an import job and processes it in the background (fetch,
        parse, match against the local catalog). Poll the job until it is
        `ready`, then commit. One import may run at a time per user; a new
        import supersedes an uncommitted preview. Unavailable in demo mode.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartAniListImportRequest" }
      responses:
        "202":
          description: Import job created and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        default:
          $ref: "#/components/responses/Error"

  /import/mal:
    post:
      operationId: startMALImport
      summary: Import a MyAnimeList XML export (.xml or .xml.gz)
      description: >
        Upload the official MAL export file. The file is parsed
        synchronously (malformed files fail immediately); matching runs in
        the background. Poll the job until it is `ready`, then commit.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MAL export, plain XML or gzipped
      responses:
        "202":
          description: Import job created and queued for matching
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        default:
          $ref: "#/components/responses/Error"

  /import/jobs/{id}:
    get:
      operationId: getImportJob
      summary: Import job status and match preview
      description: >
        `rows` is populated once the job is `ready`: each source entry with
        its converted values, match outcome, and (when matched) the target
        anime. Poll every ~2s while `pending`/`processing`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The job with preview rows when available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobDetail" }
        default:
          $ref: "#/components/responses/Error"

  /import/jobs/{id}/commit:
    post:
      operationId: commitImportJob
      summary: Apply a ready import to the user's list
      description: >
        Applies matched rows in one transaction — without emitting any
        activity events (imports never appear in feeds or trending).
        `merge` skips titles already on the list; `overwrite` lets the
        import win. Review-bucket rows are skipped unless resolved via
        `resolutions`; a resolution with a null `anime_id` excludes the row.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitImportRequest" }
      responses:
        "200":
          description: Import applied; final counts on the returned job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobDetail" }
        default:
          $ref: "#/components/responses/Error"

