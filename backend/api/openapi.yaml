openapi: 3.0.3
info:
  title: Cour API
  version: 0.1.0
  description: |
    REST API for Cour, the seasonal-first anime tracking platform.
    All paths are served under `/api/v1`. Errors use a consistent envelope
    with stable machine-readable codes. Anime metadata is sourced from
    AniList (https://anilist.co).
servers:
  - url: /api/v1

paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; session established (refresh cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session established (refresh cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie into a fresh session
      description: >
        Requires the httpOnly refresh cookie and an `X-Requested-With` header.
        Reusing an already-rotated token revokes the whole session family.
      responses:
        "200":
          description: New session (refresh cookie rotated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke this session family and clear the cookie
      responses:
        "204": { description: Logged out }
        default:
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      operationId: getMe
      summary: The authenticated account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPrivate" }
        default:
          $ref: "#/components/responses/Error"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with a mailed token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Email verified }
        default:
          $ref: "#/components/responses/Error"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Send a password-reset link
      description: Always answers 202 — account existence is never revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: If the account exists, an email is on its way }
        default:
          $ref: "#/components/responses/Error"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a mailed token
      description: Consuming the token revokes every live session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Password updated }
        default:
          $ref: "#/components/responses/Error"

  /auth/discord:
    get:
      operationId: discordStart
      summary: Begin Discord OAuth (redirects to discord.com)
      responses:
        "302": { description: Redirect to Discord authorize page }
        default:
          $ref: "#/components/responses/Error"

  /auth/discord/callback:
    get:
      operationId: discordCallback
      summary: Discord OAuth callback (redirects back to the web app)
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to the web app with the session cookie set }
        default:
          $ref: "#/components/responses/Error"

  /me/list:
    get:
      operationId: getMyList
      summary: The authenticated user's anime list
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ListStatus" }
      responses:
        "200":
          description: List entries, most recently updated first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyList" }
        default:
          $ref: "#/components/responses/Error"

  /me/list/{animeId}:
    parameters:
      - name: animeId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMyListEntry
      summary: This user's entry for one anime (404 when untracked)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: upsertMyListEntry
      summary: Add or update this anime on the user's list
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertListEntryRequest" }
      responses:
        "200":
          description: The resulting entry (after auto-transitions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyListEntry
      summary: Remove this anime from the user's list
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        default:
          $ref: "#/components/responses/Error"

  /me/favorites:
    get:
      operationId: getMyFavorites
      summary: The authenticated user's favorites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Favorites, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoritesList" }
        default:
          $ref: "#/components/responses/Error"

  /me/favorites/{animeId}:
    parameters:
      - name: animeId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getFavoriteState
      summary: Whether this anime is in the user's favorites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteState" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: addFavorite
      summary: Add to favorites
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Favorited }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFavorite
      summary: Remove from favorites
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Unfavorited }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}:
    get:
      operationId: getUserProfile
      summary: Public profile with stats and showcases
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        default:
          $ref: "#/components/responses/Error"

  /me/profile:
    patch:
      operationId: updateMyProfile
      summary: Edit bio, avatar, and favorite genres
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPrivate" }
        default:
          $ref: "#/components/responses/Error"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a fresh email-verification link
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Sent (no-op when already verified) }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/follow:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, maxLength: 20 }
    get:
      operationId: getFollowState
      summary: Follow counts and whether the caller follows this user
      responses:
        "200":
          description: Relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: followUser
      summary: Follow this user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unfollowUser
      summary: Unfollow this user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated relation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationState" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/followers:
    get:
      operationId: listFollowers
      summary: Who follows this user
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Followers, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/following:
    get:
      operationId: listFollowing
      summary: Who this user follows
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Followed users, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRefList" }
        default:
          $ref: "#/components/responses/Error"

  /me/feed:
    get:
      operationId: getMyFeed
      summary: Activity from everyone the caller follows
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        default:
          $ref: "#/components/responses/Error"

  /me/notifications:
    get:
      operationId: getMyNotifications
      summary: The caller's notifications, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/unread-count:
    get:
      operationId: getUnreadCount
      summary: Unread notification count (for the bell)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read (specific ids or all)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "204": { description: Marked }
        default:
          $ref: "#/components/responses/Error"

  /reports:
    post:
      operationId: fileReport
      summary: Report content or a user to the moderators
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileReportRequest" }
      responses:
        "202": { description: Filed (duplicates are absorbed silently) }
        default:
          $ref: "#/components/responses/Error"

  /mod/reports:
    get:
      operationId: listOpenReports
      summary: Open reports queue (moderators only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Open reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        default:
          $ref: "#/components/responses/Error"

  /mod/reports/{reportId}:
    post:
      operationId: resolveReport
      summary: Close a report as resolved or dismissed (moderators only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveReportRequest" }
      responses:
        "204": { description: Closed }
        default:
          $ref: "#/components/responses/Error"

  /import/anilist:
    post:
      operationId: startAniListImport
      summary: Import a public AniList list by username
      description: >
        Creates an import job and processes it in the background (fetch,
        parse, match against the local catalog). Poll the job until it is
        `ready`, then commit. One import may run at a time per user; a new
        import supersedes an uncommitted preview. Unavailable in demo mode.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartAniListImportRequest" }
      responses:
        "202":
          description: Import job created and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        default:
          $ref: "#/components/responses/Error"

  /import/mal:
    post:
      operationId: startMALImport
      summary: Import a MyAnimeList XML export (.xml or .xml.gz)
      description: >
        Upload the official MAL export file. The file is parsed
        synchronously (malformed files fail immediately); matching runs in
        the background. Poll the job until it is `ready`, then commit.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MAL export, plain XML or gzipped
      responses:
        "202":
          description: Import job created and queued for matching
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        default:
          $ref: "#/components/responses/Error"

  /import/jobs/{id}:
    get:
      operationId: getImportJob
      summary: Import job status and match preview
      description: >
        `rows` is populated once the job is `ready`: each source entry with
        its converted values, match outcome, and (when matched) the target
        anime. Poll every ~2s while `pending`/`processing`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The job with preview rows when available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobDetail" }
        default:
          $ref: "#/components/responses/Error"

  /import/jobs/{id}/commit:
    post:
      operationId: commitImportJob
      summary: Apply a ready import to the user's list
      description: >
        Applies matched rows in one transaction — without emitting any
        activity events (imports never appear in feeds or trending).
        `merge` skips titles already on the list; `overwrite` lets the
        import win. Review-bucket rows are skipped unless resolved via
        `resolutions`; a resolution with a null `anime_id` excludes the row.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitImportRequest" }
      responses:
        "200":
          description: Import applied; final counts on the returned job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobDetail" }
        default:
          $ref: "#/components/responses/Error"

  /anime:
    get:
      operationId: listAnime
      summary: Browse or search the catalog
      description: >
        With `q`, performs ranked fuzzy search. Without it, browses by
        popularity with optional filters.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: genre
          in: query
          schema: { type: string, maxLength: 50 }
        - name: year
          in: query
          schema: { type: integer, minimum: 1940, maximum: 2100 }
        - name: season
          in: query
          schema: { $ref: "#/components/schemas/Season" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AiringStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200":
          description: Matching anime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimeList" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}:
    get:
      operationId: getAnime
      summary: Anime detail with episodes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The anime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimeDetail" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/reviews:
    get:
      operationId: listAnimeReviews
      summary: Reviews for an anime, most helpful first
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/reviews/mine:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMyReview
      summary: The caller's review of this anime (404 when none)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: upsertMyReview
      summary: Write or edit the caller's review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertReviewRequest" }
      responses:
        "200":
          description: The saved review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default:
          $ref: "#/components/responses/Error"

  /reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getReview
      summary: One review with its anime
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDetail" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteReview
      summary: Soft-delete a review (author or moderator)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        default:
          $ref: "#/components/responses/Error"

  /reviews/{reviewId}/helpful:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: markHelpful
      summary: Mark a review helpful
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: New vote state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unmarkHelpful
      summary: Remove a helpful mark
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: New vote state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
        default:
          $ref: "#/components/responses/Error"

  /users/{username}/reviews:
    get:
      operationId: listUserReviews
      summary: Reviews written by a user, newest first
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Reviews with their anime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserReviewList" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/threads:
    get:
      operationId: getAnimeThreads
      summary: Discussion index for an anime (series board + episode threads)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Existing threads and their sizes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadIndex" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/threads/series:
    get:
      operationId: getSeriesThread
      summary: The anime's series board (created on first visit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        default:
          $ref: "#/components/responses/Error"

  /anime/{id}/episodes/{number}/thread:
    get:
      operationId: getEpisodeThread
      summary: An episode's thread with context (created on first visit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: number
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Thread + episode + anime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeThread" }
        default:
          $ref: "#/components/responses/Error"

  /threads/{threadId}/comments:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listComments
      summary: A thread's comments, oldest first (client builds the tree)
      responses:
        "200":
          description: Comments with authors and reactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postComment
      summary: Add a comment (optionally anchored to a moment)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCommentRequest" }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "#/components/responses/Error"

  /comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Soft-delete a comment (author or moderator); tombstone remains
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Deleted }
        default:
          $ref: "#/components/responses/Error"

  /comments/{commentId}/reactions/{emoji}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: emoji
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Emoji" }
    put:
      operationId: addReaction
      summary: React to a comment
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Reacted }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeReaction
      summary: Remove a reaction
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        default:
          $ref: "#/components/responses/Error"

  /seasons/{year}/{season}:
    get:
      operationId: getSeason
      summary: Seasonal chart
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer, minimum: 1940, maximum: 2100 }
        - name: season
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Season" }
      responses:
        "200":
          description: All titles airing in the season, most popular first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonChart" }
        default:
          $ref: "#/components/responses/Error"

  /trending:
    get:
      operationId: getTrending
      summary: Trending Now — recency-weighted, time-decayed
      description: >
        Ranked by recent Cour activity with exponential time decay (not
        all-time popularity), lightly blended with AniList's trending signal.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Ranked titles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendingList" }
        default:
          $ref: "#/components/responses/Error"

  /hidden-gems:
    get:
      operationId: getHiddenGems
      summary: Recent, highly-rated, under-watched titles
      responses:
        "200":
          description: The gems rail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryList" }
        default:
          $ref: "#/components/responses/Error"

  /me/recommendations:
    get:
      operationId: getMyRecommendations
      summary: Taste-based suggestions with explanations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Personalized picks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendations" }
        default:
          $ref: "#/components/responses/Error"

  /schedule:
    get:
      operationId: getSchedule
      summary: Airing schedule for a time window
      description: Defaults to the next 7 days. The window is capped at 14 days.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Episodes airing in the window, soonest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        username:
          type: string
          pattern: "^[a-zA-Z0-9_]{3,20}$"
          description: 3-20 characters, letters/digits/underscore
        password: { type: string, minLength: 8, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: Short-lived JWT for the Authorization header }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access-token lifetime in seconds }
        user: { $ref: "#/components/schemas/UserPrivate" }

    Role:
      type: string
      enum: [user, mod, admin]

    UserPrivate:
      type: object
      required: [id, email, username, avatar_url, bio, favorite_genres, role, email_verified, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string }
        favorite_genres:
          type: array
          items: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    UserProfile:
      type: object
      required:
        [username, avatar_url, bio, favorite_genres, role, created_at, stats,
         favorites, currently_watching]
      properties:
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string }
        favorite_genres:
          type: array
          items: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        favorites:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        currently_watching:
          type: array
          items: { $ref: "#/components/schemas/WatchingEntry" }

    ProfileStats:
      type: object
      required: [counts, mean_score, rated_count, episodes_watched, genres]
      properties:
        counts:
          type: object
          required: [watching, completed, planning, paused, dropped]
          properties:
            watching: { type: integer }
            completed: { type: integer }
            planning: { type: integer }
            paused: { type: integer }
            dropped: { type: integer }
        mean_score:
          type: number
          nullable: true
          description: Mean of 1-10 scores; null until something is rated
        rated_count: { type: integer }
        episodes_watched: { type: integer }
        genres:
          type: array
          items:
            type: object
            required: [genre, count]
            properties:
              genre: { type: string }
              count: { type: integer }

    WatchingEntry:
      type: object
      required: [anime, progress]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        progress: { type: integer }

    UpdateProfileRequest:
      type: object
      properties:
        bio: { type: string, maxLength: 500 }
        avatar_url:
          type: string
          nullable: true
          maxLength: 500
          description: http(s) URL; null clears the avatar
        favorite_genres:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 30 }

    ListStatus:
      type: string
      enum: [watching, completed, planning, paused, dropped]

    ListEntry:
      type: object
      required: [anime_id, status, score, progress, started_on, finished_on, updated_at]
      properties:
        anime_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ListStatus" }
        score: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        progress: { type: integer, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }
        updated_at: { type: string, format: date-time }

    ListEntryWithAnime:
      allOf:
        - $ref: "#/components/schemas/ListEntry"
        - type: object
          required: [anime]
          properties:
            anime: { $ref: "#/components/schemas/AnimeSummary" }

    MyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ListEntryWithAnime" }

    UpsertListEntryRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ListStatus" }
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
          description: 1-10; 0 clears the score; omitted keeps it
        progress: { type: integer, nullable: true, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }

    FavoritesList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    FavoriteState:
      type: object
      required: [favorited]
      properties:
        favorited: { type: boolean }

    ReviewAuthor:
      type: object
      required: [username, avatar_url]
      properties:
        username: { type: string }
        avatar_url: { type: string, nullable: true }

    Review:
      type: object
      required:
        [id, anime_id, author, body, score, has_spoilers, helpful_count,
         voted, is_mine, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        anime_id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/ReviewAuthor" }
        body: { type: string }
        score: { type: integer, minimum: 1, maximum: 10 }
        has_spoilers: { type: boolean }
        helpful_count: { type: integer }
        voted: { type: boolean, description: Whether the caller marked it helpful (false when anonymous) }
        is_mine: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReviewDetail:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [anime]
          properties:
            anime: { $ref: "#/components/schemas/AnimeSummary" }

    UpsertReviewRequest:
      type: object
      required: [body, score]
      properties:
        body: { type: string, minLength: 100, maxLength: 20000 }
        score: { type: integer, minimum: 1, maximum: 10 }
        has_spoilers: { type: boolean, default: false }

    ReviewList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        page: { $ref: "#/components/schemas/PageInfo" }

    UserReviewList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReviewDetail" }
        page: { $ref: "#/components/schemas/PageInfo" }

    HelpfulState:
      type: object
      required: [helpful_count, voted]
      properties:
        helpful_count: { type: integer }
        voted: { type: boolean }

    ReportSubject:
      type: string
      enum: [review, comment, user]

    FileReportRequest:
      type: object
      required: [subject_type, subject_id, reason]
      properties:
        subject_type: { $ref: "#/components/schemas/ReportSubject" }
        subject_id: { type: integer, format: int64 }
        reason: { type: string, minLength: 3, maxLength: 500 }

    Report:
      type: object
      required: [id, subject_type, subject_id, reason, reporter, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_type: { $ref: "#/components/schemas/ReportSubject" }
        subject_id: { type: integer, format: int64 }
        reason: { type: string }
        reporter: { type: string, description: Reporter's username }
        created_at: { type: string, format: date-time }

    ReportList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        next_cursor:
          type: integer
          format: int64
          nullable: true

    ResolveReportRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [resolved, dismissed]

    ImportSource:
      type: string
      enum: [anilist, mal]

    ImportStatus:
      type: string
      description: >
        pending/processing — being fetched and matched; ready — preview
        available, awaiting commit; committing — apply in flight; done —
        applied; failed — fetch or parse error (see `error`); superseded —
        replaced by a newer import before commit.
      enum: [pending, processing, ready, committing, done, failed, superseded]

    ImportMatch:
      type: string
      description: >
        How the row found its target: by source id, by title similarity,
        or not at all (`review` — resolve manually or it is skipped).
      enum: [id, title, review]

    StartAniListImportRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 30
          description: AniList username; the list must be public

    ImportCounts:
      type: object
      description: Zero until the relevant stage has run.
      required: [total, matched, review, conflicts, applied, skipped]
      properties:
        total: { type: integer, description: Parsed source rows }
        matched: { type: integer, description: Rows with a target anime }
        review: { type: integer, description: Rows needing manual resolution }
        conflicts: { type: integer, description: Matched rows already on the list at preview time }
        applied: { type: integer, description: Rows written by the commit }
        skipped: { type: integer, description: Rows the commit left out (merge conflicts, unresolved reviews, exclusions) }

    ImportJob:
      type: object
      required: [id, source, status, counts, error, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        source: { $ref: "#/components/schemas/ImportSource" }
        status: { $ref: "#/components/schemas/ImportStatus" }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        error:
          type: string
          nullable: true
          description: Human-readable failure reason, when failed
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImportRow:
      type: object
      required: [row_index, title, status, score, progress, match, anime, on_list]
      properties:
        row_index:
          type: integer
          description: Stable index into the job's parsed rows; key for `resolutions`
        title: { type: string, description: Title as it appears in the source }
        status: { $ref: "#/components/schemas/ListStatus" }
        score: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        progress: { type: integer, minimum: 0 }
        started_on: { type: string, format: date, nullable: true }
        finished_on: { type: string, format: date, nullable: true }
        match: { $ref: "#/components/schemas/ImportMatch" }
        anime:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AnimeSummary" }]
          description: The matched target; null for review rows
        on_list:
          type: boolean
          description: Already on the user's list when the preview was built

    ImportJobDetail:
      allOf:
        - $ref: "#/components/schemas/ImportJob"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              description: Empty until the job is ready
              items: { $ref: "#/components/schemas/ImportRow" }

    ImportResolution:
      type: object
      required: [row_index, anime_id]
      properties:
        row_index: { type: integer, minimum: 0 }
        anime_id:
          type: integer
          format: int64
          nullable: true
          description: Target anime for this row; null excludes the row

    CommitImportRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [merge, overwrite]
          description: merge skips titles already on the list; overwrite lets the import win
        resolutions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ImportResolution" }

    TrendingList:
      type: object
      required: [data, computed_at]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        computed_at: { type: string, format: date-time, nullable: true }

    DiscoveryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    RecommendationItem:
      type: object
      required: [anime, reasons]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        reasons:
          type: array
          items: { type: string }

    Recommendations:
      type: object
      required: [data, cold_start]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItem" }
        cold_start:
          type: boolean
          description: True when there was no taste signal and the list falls back to trending + gems

    RelationState:
      type: object
      required: [followers, following, is_following]
      properties:
        followers: { type: integer }
        following: { type: integer }
        is_following: { type: boolean, description: Always false for anonymous callers }

    UserRefList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReviewAuthor" }

    ActivityType:
      type: string
      enum: [list_add, status_change, progress, completed, scored, favorite, review, comment, helpful_vote]

    FeedItem:
      type: object
      required: [id, actor, type, anime, ref_id, payload, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: "#/components/schemas/ReviewAuthor" }
        type: { $ref: "#/components/schemas/ActivityType" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        ref_id: { type: integer, format: int64, nullable: true }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    Feed:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: Pass back as ?cursor= for the next page; null at the end

    NotificationType:
      type: string
      enum: [comment_reply, new_follower, episode_aired]

    Notification:
      type: object
      required: [id, type, actor, anime, ref_id, payload, read, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/NotificationType" }
        actor:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReviewAuthor" }]
        anime:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AnimeSummary" }]
        ref_id: { type: integer, format: int64, nullable: true }
        payload:
          type: object
          additionalProperties: true
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_cursor:
          type: integer
          format: int64
          nullable: true

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    MarkReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: integer, format: int64 }
        all: { type: boolean, default: false }

    Emoji:
      type: string
      enum: ["+1", heart, laugh, surprise, cry, fire]

    Thread:
      type: object
      required: [id, anime_id, kind, comment_count, last_activity_at]
      properties:
        id: { type: integer, format: int64 }
        anime_id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [series, episode]
        comment_count: { type: integer }
        last_activity_at: { type: string, format: date-time }

    EpisodeThread:
      type: object
      required: [thread, anime, episode]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { $ref: "#/components/schemas/Episode" }

    ThreadIndex:
      type: object
      required: [series, episodes]
      properties:
        series:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Thread" }]
        episodes:
          type: array
          items:
            type: object
            required: [number, thread_id, comment_count, last_activity_at]
            properties:
              number: { type: integer }
              thread_id: { type: integer, format: int64 }
              comment_count: { type: integer }
              last_activity_at: { type: string, format: date-time }

    ReactionCount:
      type: object
      required: [emoji, count, mine]
      properties:
        emoji: { $ref: "#/components/schemas/Emoji" }
        count: { type: integer }
        mine: { type: boolean }

    Comment:
      type: object
      required:
        [id, thread_id, parent_id, author, body, timestamp_seconds,
         has_spoilers, deleted, reactions, created_at]
      properties:
        id: { type: integer, format: int64 }
        thread_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, nullable: true }
        author: { $ref: "#/components/schemas/ReviewAuthor" }
        body: { type: string, description: "\"[removed]\" when deleted" }
        timestamp_seconds:
          type: integer
          nullable: true
          description: Moment anchor within the episode
        has_spoilers: { type: boolean }
        deleted: { type: boolean }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionCount" }
        created_at: { type: string, format: date-time }

    CommentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Comment" }

    PostCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
        parent_id: { type: integer, format: int64, nullable: true }
        timestamp_seconds:
          type: integer
          nullable: true
          minimum: 0
          maximum: 35999
          description: Only valid in episode threads
        has_spoilers: { type: boolean, default: false }

    Season:
      type: string
      enum: [WINTER, SPRING, SUMMER, FALL]

    AiringStatus:
      type: string
      enum: [FINISHED, RELEASING, NOT_YET_RELEASED, CANCELLED, HIATUS]

    Format:
      type: string
      enum: [TV, TV_SHORT, MOVIE, SPECIAL, OVA, ONA, MUSIC]

    AnimeSummary:
      type: object
      required:
        [id, slug, title, title_english, cover_image, cover_color, format,
         status, season, season_year, episodes_count, average_score,
         popularity, genres, next_airing_at, next_airing_episode]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: Cosmetic URL segment derived from the title }
        title: { type: string, description: Romaji title }
        title_english: { type: string, nullable: true }
        cover_image: { type: string, nullable: true }
        cover_color: { type: string, nullable: true, description: Dominant cover color, hex }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Format" }]
        status: { $ref: "#/components/schemas/AiringStatus" }
        season:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Season" }]
        season_year: { type: integer, nullable: true }
        episodes_count: { type: integer, nullable: true }
        average_score: { type: integer, nullable: true, description: AniList community mean, 0-100 }
        popularity: { type: integer }
        genres:
          type: array
          items: { type: string }
        next_airing_at: { type: string, format: date-time, nullable: true }
        next_airing_episode: { type: integer, nullable: true }

    AnimeDetail:
      allOf:
        - $ref: "#/components/schemas/AnimeSummary"
        - type: object
          required:
            [anilist_id, title_native, synonyms, description, banner_image,
             duration_min, tags, studios, episodes, synced_at]
          properties:
            anilist_id: { type: integer }
            title_native: { type: string, nullable: true }
            synonyms:
              type: array
              items: { type: string }
            description:
              type: string
              nullable: true
              description: Plain text with newlines; AniList markup stripped.
            banner_image: { type: string, nullable: true }
            duration_min: { type: integer, nullable: true }
            tags:
              type: array
              items: { $ref: "#/components/schemas/Tag" }
            studios:
              type: array
              items: { $ref: "#/components/schemas/Studio" }
            episodes:
              type: array
              items: { $ref: "#/components/schemas/Episode" }
            synced_at: { type: string, format: date-time }

    Tag:
      type: object
      required: [name, rank]
      properties:
        name: { type: string }
        rank: { type: integer }

    Studio:
      type: object
      required: [name, is_main]
      properties:
        name: { type: string }
        is_main: { type: boolean }

    Episode:
      type: object
      required: [number, title, airing_at]
      properties:
        number: { type: integer }
        title: { type: string, nullable: true }
        airing_at: { type: string, format: date-time, nullable: true }

    ScheduleEntry:
      type: object
      required: [anime, episode, airing_at]
      properties:
        anime: { $ref: "#/components/schemas/AnimeSummary" }
        episode: { type: integer }
        airing_at: { type: string, format: date-time }

    AnimeList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }

    SeasonChart:
      type: object
      required: [season, year, data]
      properties:
        season: { $ref: "#/components/schemas/Season" }
        year: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/AnimeSummary" }

    ScheduleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEntry" }

    PageInfo:
      type: object
      required: [page, per_page, has_more]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        has_more: { type: boolean }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code: bad_request, validation_failed,
                unauthorized, forbidden, not_found, conflict, rate_limited,
                internal_error, service_unavailable.
            message: { type: string }
            details: {}
